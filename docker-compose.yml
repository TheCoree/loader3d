# Production deployment. All settings live in .env (copy .env.example -> .env);
# the defaults below are used only when a variable is missing.
#
#   docker compose up -d            # first start: builds the image and starts it
#   docker compose up -d --build    # after git pull: rebuild and restart

services:
  web:
    build:
      context: .
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
        CADDY_VERSION: ${CADDY_VERSION:-2}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificates and ACME account: must survive container re-creation.
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-3}"

volumes:
  caddy_data:
  caddy_config:
