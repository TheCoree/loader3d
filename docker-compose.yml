# Production deployment. All settings live in .env (copy .env.example -> .env);
# the defaults below are used only when a variable is missing.
#
#   docker compose up -d            # first start: builds the images and starts everything
#   docker compose up -d --build    # after git pull: rebuild and restart
#
# web (Caddy): static frontend + HTTPS, proxies /api/* to api
# api (FastAPI, backend/): applies database migrations on start
# db  (Postgres): reachable only from the compose network
# mail (docker-mailserver, optional): own mail server, only with COMPOSE_PROFILES=mail

x-logging: &logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

services:
  web:
    build:
      context: .
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
        CADDY_VERSION: ${CADDY_VERSION:-2}
        # Absolute URLs of the prerendered landing page (canonical, Open Graph, sitemap.xml).
        SITE_URL: ${SITE_URL:-}
        # Tariffs on the site (the landing page is prerendered with or without them); the api reads it too.
        TIERS_ENABLED: ${TIERS_ENABLED:-false}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # Other names (www, the mail server): HTTPS and a redirect to SITE_URL. The default matches nothing.
      REDIRECT_ADDRESS: ${REDIRECT_ADDRESS:-http://redirect.localhost}
      SITE_URL: ${SITE_URL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificates and ACME account: must survive container re-creation.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

  api:
    build:
      context: ./backend
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-loader3d}@db:5432/${POSTGRES_DB:-loader3d}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-true}
      MAIL_BACKEND: ${MAIL_BACKEND:-console}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # The link at the bottom of the letters.
      SITE_URL: ${SITE_URL:-}
      # The api is reachable only from the compose network (through Caddy), so its X-Forwarded-For is trusted.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      TIERS_ENABLED: ${TIERS_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  db:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loader3d}
      POSTGRES_USER: ${POSTGRES_USER:-loader3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18+ keeps its data under /var/lib/postgresql/<major>/: all accounts and plans.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # Own mail server (docker-mailserver): mailboxes of the domain and the letters with codes, without a
  # mail provider. Started only with COMPOSE_PROFILES=mail; DNS records, PTR and first steps — README.
  # TLS: the certificate Caddy gets for MAIL_HOSTNAME (it must be listed in REDIRECT_ADDRESS), read from
  # the shared caddy_data volume; renewals are picked up by themselves.
  mail:
    image: ghcr.io/docker-mailserver/docker-mailserver:${DMS_VERSION:-17}
    profiles: [mail]
    hostname: ${MAIL_HOSTNAME:-mail.example.com}
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      LOG_LEVEL: warn
      SSL_TYPE: manual
      SSL_CERT_PATH: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${MAIL_HOSTNAME:-mail.example.com}/${MAIL_HOSTNAME:-mail.example.com}.crt
      SSL_KEY_PATH: /caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${MAIL_HOSTNAME:-mail.example.com}/${MAIL_HOSTNAME:-mail.example.com}.key
      # Senders may use only their own address (or aliases); nobody relays without logging in.
      SPOOF_PROTECTION: 1
      PERMIT_DOCKER: none
      # Rspamd: spam filter for incoming mail and DKIM signing of outgoing; the older filters are off.
      ENABLE_RSPAMD: 1
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_POLICYD_SPF: 0
      ENABLE_AMAVIS: 0
      ENABLE_SPAMASSASSIN: 0
      ENABLE_CLAMAV: 0
      ENABLE_POP3: 0
      ENABLE_FAIL2BAN: 1
      ENABLE_UPDATE_CHECK: 0
    ports:
      - "25:25" #   SMTP: mail from other servers
      - "465:465" # SMTP submission, implicit TLS: mail clients and the api
      - "587:587" # SMTP submission, STARTTLS
      - "993:993" # IMAP, implicit TLS
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      # Accounts, aliases, DKIM keys (setup email add / setup config dkim).
      - mail_config:/tmp/docker-mailserver
      - caddy_data:/caddy-data:ro
      - /etc/localtime:/etc/localtime:ro
    cap_add:
      - NET_ADMIN # fail2ban
    networks:
      default:
        # The api sends through SMTP_HOST=MAIL_HOSTNAME: inside the network the name leads straight here
        # and matches the certificate.
        aliases:
          - ${MAIL_HOSTNAME:-mail.example.com}
    depends_on:
      - web
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  mail_data:
  mail_state:
  mail_logs:
  mail_config:
